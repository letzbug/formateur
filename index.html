<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#00164a">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Espace Formateurs UniPop</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/poppins-400.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/poppins-500.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/iframe-resize.js"></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="page" id="page">
    <svg class="motif" viewBox="0 0 440 520" aria-hidden="true" focusable="false">
      <path d="M70 -40 V250 a150 150 0 0 0 300 0 V-40" fill="none" stroke="currentColor" stroke-width="92"/>
    </svg>
    <span class="motif-line" aria-hidden="true"></span>

    <main id="app" class="app" aria-busy="true">
      <p class="app-loading">Chargement des ressources…</p>
      <noscript>
        <div class="load-error">
          <h1>Espace Formateurs UniPop</h1>
          <p>Cette page nécessite JavaScript pour afficher les ressources. Activez JavaScript ou consultez <a href="https://www.unipop.lu/" target="_blank" rel="noopener">unipop.lu</a>.</p>
        </div>
      </noscript>
    </main>
  </div>

</html>
